<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACEVEDO TV – Desde el Huila para el mundo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1581093588401-22f0c32f5da3?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    header {
      background: linear-gradient(90deg, #003300, #00aa33);
      padding: 20px;
      font-size: 2em;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 15px #00ff66;
      border-bottom: 3px solid #00ff66;
    }

    header p {
      font-size: 0.6em;
      margin: 5px 0 0 0;
      font-style: italic;
      color: #ffee00;
      text-shadow: 0 0 10px #ffee00;
    }

    .button-container {
      margin: 25px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      background-color: #003300;
      color: #00ff66;
      border: 2px solid #00ff66;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00ff66;
    }

    button:hover {
      background-color: #00ff66;
      color: #003300;
      box-shadow: 0 0 20px #ffee00, 0 0 30px #00ff66;
      transform: scale(1.05);
    }

    video {
      width: 90%;
      max-width: 900px;
      height: auto;
      border: 3px solid #00ff66;
      border-radius: 10px;
      box-shadow: 0 0 30px #00ff66;
      background: #000;
    }

    footer {
      margin-top: 20px;
      font-size: 0.8em;
      color: #ccc;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <header>
    ACEVEDO TV
    <p>El mejor entretenimiento desde el Huila para el mundo</p>
  </header>

  <div class="button-container">
    <button onclick="changeChannel('https://byecableiptvnew3.ddns.net/ENVIVOMIGENTE/index.m3u8')">🎥 Canal 1 - MiGente TV</button>
    <button onclick="changeChannel('https://mdstrm.com/live-stream-playlist/5a5e1c2568b1910913db5fe2.m3u8')">🎞 Canal 2 - Canal uno TV</button>
    <button onclick="changeChannel('https://59ec5453559f0.streamlock.net/JennyLive/JennyLive/playlist.m3u8')">🍿 Canal 3 - Miami TV</button>
    <button onclick="changeChannel('https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8')">🎬 Canal 4 - red bull TV</button>
    <button onclick="changeChannel('https://wildearth-plex.amagi.tv/masterR1080p.m3u8')">🐾 Canal 5 - WildEarth</button>
  </div>

  <video id="player" controls autoplay></video>

  <footer>
    © 2025 ACEVEDO TV - Producciones Acevedo. Todos los derechos reservados.
  </footer>

  <script>
    const video = document.getElementById('player');
    function changeChannel(url) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        video.play();
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      } else {
        alert('Tu dispositivo no soporta este tipo de video. Intenta en otro navegador o TV Box.');
      }
    }

    // Canal inicial
    window.onload = () => changeChannel('https://byecableiptvnew3.ddns.net/ENVIVOMIGENTE/index.m3u8');
  </script>

</body>
</html>
