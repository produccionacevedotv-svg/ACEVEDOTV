<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acevedo TV – Desde el Huila para el mundo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #e60000;
      padding: 15px;
      font-size: 1.5em;
      font-weight: bold;
      text-transform: uppercase;
    }
    .button-container {
      margin: 20px 0;
    }
    button {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #e60000;
    }
    video {
      width: 90%;
      max-width: 900px;
      height: auto;
      background: #000;
      border: 3px solid #e60000;
      border-radius: 10px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <header>
    Acevedo TV – Desde el Huila para el mundo
  </header>

  <div class="button-container">
    <button onclick="changeChannel('https://byecableiptvnew3.ddns.net/ENVIVOMIGENTE/index.m3u8')">Canal 1 - Acevedo TV</button>
    <button onclick="changeChannel('https://mdstrm.com/live-stream-playlist/5a5e1c2568b1910913db5fe2.m3u8')">Canal 2 - Wix TV</button>
    <button onclick="changeChannel('https://59ec5453559f0.streamlock.net/JennyLive/JennyLive/playlist.m3u8')">Canal 3 - Película TV</button>
  </div>

  <video id="player" controls autoplay></video>

  <script>
    const video = document.getElementById('player');
    function changeChannel(url) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        video.play();
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      } else {
        alert('Tu dispositivo no soporta este tipo de video. Intenta en otro navegador o TV Box.');
      }
    }

    // Reproduce el primer canal al cargar
    window.onload = () => changeChannel('https://byecableiptvnew3.ddns.net/ENVIVOMIGENTE/index.m3u8');
  </script>

</body>
</html>
